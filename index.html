<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тендер Платформа | ХМАО</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0A0A0A; --card: #111; --card2: #161616; --border: #222;
  --accent: #FF5C00; --green: #00C896; --blue: #3B82F6;
  --yellow: #F59E0B; --red: #EF4444; --purple: #A855F7;
  --text: #F0F0F0; --muted: #555; --muted2: #2a2a2a;
}
body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Mono', monospace; min-height: 100vh; }
button { cursor: pointer; font-family: inherit; }
input, textarea, select { font-family: inherit; }
.header { border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.logo-title { font-size: 14px; font-weight: 700; color: var(--accent); letter-spacing: .05em; }
.logo-sub { font-size: 10px; color: var(--muted); letter-spacing: .1em; margin-top: 2px; }
.stats { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.stat { text-align: center; }
.stat-val { font-size: 15px; font-weight: 700; }
.stat-lbl { font-size: 9px; color: var(--muted); letter-spacing: .1em; }
.btn-add { background: #FF5C0022; border: 1px solid var(--accent); color: var(--accent); padding: 6px 16px; border-radius: 6px; font-size: 12px; font-weight: 700; }
.tabs { border-bottom: 1px solid var(--border); padding: 0 20px; display: flex; }
.tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 12px 16px; font-size: 12px; font-weight: 600; letter-spacing: .05em; color: var(--muted); transition: .15s; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.kanban { overflow-x: auto; padding: 16px; }
.kanban-inner { display: flex; gap: 12px; min-width: max-content; }
